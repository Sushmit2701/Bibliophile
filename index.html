<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bibliophile</title>
  <meta name="description" content="A personal commonplace book for the books you read: highlights, quotes, notes and reviews.">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1311" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bibliophile">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="#/" class="brand" data-route=""><span class="logo">❦</span><span class="label">Bibliophile</span><span class="tagline">a commonplace book</span></a>
    <a href="#/" data-route=""><span class="ni">⌂</span><span class="label">Home</span></a>
    <a href="#/library" data-route="library"><span class="ni">▤</span><span class="label">Library</span></a>
    <a href="#/notes" data-route="notes"><span class="ni">❝</span><span class="label">Notebook</span></a>
    <a href="#/review" data-route="review"><span class="ni">↻<i class="review-dot" hidden></i></span><span class="label">Review</span></a>
    <a href="#/stats" data-route="stats"><span class="ni">▦</span><span class="label">Stats</span></a>
    <a href="#/settings" data-route="settings"><span class="ni">⚙</span><span class="label">Settings</span></a>
  </nav>
  <main id="main"></main>
  <button class="fab" data-action="add-item" aria-label="Save a passage">+</button>
  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
